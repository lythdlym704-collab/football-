<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة كرة القدم</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b1a12;--fg:#fff;--glass:rgba(0,0,0,.45);--accent:#1f8a4c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050d08}}
:root[data-theme="dark"]{--bg:#050d08}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:absolute;left:50%;top:50%;margin:-240px 0 0 -400px;width:800px;height:480px;font-size:24px;transform-origin:center}
canvas{width:100%;height:100%;display:block;border-radius:.5em;background:#2f9e5b}
#hud{position:absolute;top:.3em;left:50%;transform:translateX(-50%);background:var(--glass);border-radius:.6em;padding:.15em .9em;text-align:center;direction:ltr;pointer-events:none;line-height:1.15}
#hud b{font-size:1.1em}#hud small{display:block;font-size:.55em;opacity:.85}
#rst{position:absolute;top:.3em;right:.4em;width:1.8em;height:1.8em;border-radius:50%;border:0;background:var(--glass);color:#fff;font-size:1em;padding:0}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border-radius:.5em;font-size:1.7em;font-weight:800;text-align:center;gap:.2em;z-index:5}
#msg small{font-size:.5em;font-weight:500}
button{font:inherit;font-weight:700;border:0;cursor:pointer}
.mb{font-size:.5em;background:var(--accent);color:#fff;border-radius:.6em;padding:.45em 1.2em;margin:.1em;min-width:11em}.mb.g{background:rgba(255,255,255,.2)}#again{font-size:.55em;background:var(--accent);color:#fff;border-radius:.6em;padding:.4em 1.2em;margin-top:.3em}
#js{position:absolute;left:12%;top:79%;width:6em;height:6em;border-radius:50%;background:var(--glass);border:2px solid rgba(255,255,255,.35);touch-action:none}
#kn{position:absolute;left:50%;top:50%;width:2.6em;height:2.6em;margin:-1.3em;border-radius:50%;background:rgba(255,255,255,.65)}
.btns{display:contents}
.b{position:absolute;width:3.2em;height:3.2em;border-radius:50%;background:var(--glass);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:.62em;font-weight:700;padding:0;touch-action:none}
.b.big{width:4.4em;height:4.4em;background:rgba(31,138,76,.85);font-size:.7em}
.b:active,.b.on{background:rgba(255,255,255,.4)}
#home{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:64px 16px 24px;text-align:center;touch-action:manipulation}
#home h1{font-size:1.5rem;margin:6px 0}
.card{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border-radius:18px;padding:14px 16px;width:100%;max-width:420px;text-align:start}
.pn{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}.pn b{font-size:1.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pn span{font-size:.9rem;opacity:.9}.pn small{font-size:.72rem;opacity:.7}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}.bar i{display:block;height:100%;background:#f5c518}
.ring{width:92px;height:92px;flex:none;border-radius:50%;padding:5px;position:relative;cursor:pointer;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.18) 0)}
.av{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff;border:3px solid var(--bg)}
.lv{position:absolute;bottom:-4px;left:-4px;min-width:30px;height:30px;border-radius:15px;background:#f5c518;color:#222;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);padding:0 5px}
.sec{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px;align-items:center;font-size:1.05rem}
.hb{width:100%;font-size:1.1rem;padding:16px;border-radius:14px;background:var(--accent);color:#fff}.hb.g{background:rgba(255,255,255,.14)}.hb.sm{font-size:.85rem;padding:10px}
.rowc{display:flex;gap:8px;width:100%}.rowc .hb{width:auto;padding:14px 22px}
#home input{font:inherit;font-size:1.2rem;padding:12px;border-radius:12px;border:0;text-align:center;width:100%;min-width:0}
#ci{direction:ltr;letter-spacing:.3em}.or{opacity:.7;font-size:.9rem}.code{direction:ltr;font-size:3rem;font-weight:800;letter-spacing:.25em}
#hb{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
#gear{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);font-size:1.3rem;padding:0;z-index:3}
#pv{position:relative;width:100%;aspect-ratio:5/3;background:#2f9e5b;border-radius:12px;border:2px solid rgba(255,255,255,.6);overflow:hidden;touch-action:none}
.pi{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;touch-action:none;cursor:grab;text-align:center;line-height:1}
.pi[data-k=js]::after{content:"";width:42%;height:42%;border-radius:50%;background:rgba(255,255,255,.65)}
.pi[data-k=bk]{background:rgba(31,138,76,.9)}
.sl{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;font-size:.95rem}
#home input[type=range]{padding:0;width:auto;flex:1;background:none}
.pack{width:150px;height:200px;border-radius:16px;background:linear-gradient(160deg,#ff9d1a 0,#b34700 45%,#1a0d00 100%);border:3px solid #f5c518;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:1rem;font-weight:800;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 22px rgba(255,157,26,.45)}.pack.k{background:linear-gradient(160deg,#3d8bff 0,#0b3fb0 45%,#050b24 100%);border-color:#cfe6ff;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 22px rgba(60,140,255,.5)}.stage{position:relative;width:100%;max-width:420px;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 30% 90%,var(--sg1),var(--sg2) 75%);border:2px solid rgba(255,255,255,.18)}.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.rcard{position:absolute;right:3%;top:50%;width:46%;border-radius:14px;opacity:0;transform:translateY(-50%) scale(.25) rotate(-14deg);transition:transform .65s cubic-bezier(.2,1.5,.4,1),opacity .25s;box-shadow:0 0 30px var(--sgl)}.rcard.show{opacity:1;transform:translateY(-50%) scale(1) rotate(0)}.gi{cursor:pointer}.frow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;width:100%;text-align:start}.frow .pn b{font-size:1rem}.frow .hb{width:auto;padding:8px 12px;font-size:.9rem}#fi{direction:ltr;letter-spacing:.2em;text-transform:uppercase}
#invb{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;width:min(92%,420px);background:#1b3a28;border:2px solid #f5c518;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}#invb .rowc .hb{flex:1;padding:10px}.gi.sel img{outline:3px solid #f5c518;outline-offset:-3px}.gi.sel::after{content:"⚽";position:absolute;bottom:6px;left:8px;font-size:1.2rem}
.pack img{width:66%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.pack.shake{animation:sh .15s linear 7}
@keyframes sh{0%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}100%{transform:rotate(-7deg)}}
.cardi{width:230px;max-width:72%;border-radius:16px;animation:pop .7s ease;box-shadow:0 0 30px rgba(245,197,24,.6)}
@keyframes pop{0%{transform:scale(.2) rotateY(180deg);opacity:0}100%{transform:scale(1) rotateY(0);opacity:1}}
.grid{display:flex;gap:12px;justify-content:center;width:100%}
.gi{position:relative;width:31%;max-width:120px}.gi img{width:100%;display:block;border-radius:12px}.gi.lock img{filter:grayscale(1) brightness(.3)}
.gi b{position:absolute;top:6px;right:8px;background:#f5c518;color:#222;border-radius:10px;padding:0 8px;font-size:.85rem}
.hz{font-size:2.4rem;font-weight:800;padding:34px 0;color:#f5c518}.keys{font-size:1.3rem;font-weight:700}
.hb:disabled{opacity:.4}
#chat{position:absolute;left:.4em;top:36%;width:2em;height:2em;border-radius:50%;background:var(--glass);color:#fff;font-size:1.1em;padding:0;z-index:4}
#sb{position:absolute;left:.4em;top:10%;max-height:64%;width:10.5em;background:rgba(10,20,14,.94);border-radius:.7em;padding:.4em;display:none;flex-direction:column;gap:.3em;z-index:7;overflow:auto;font-size:.7em;text-align:center}
#sb button{background:rgba(255,255,255,.14);color:#fff;border-radius:.6em;padding:.55em .4em;font-size:1em}
#fp{position:absolute;top:.35em;left:.45em;font-size:.4em;opacity:.85;color:#fff;pointer-events:none;direction:ltr;z-index:6}
#msg.banner{inset:auto;top:15%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.4);padding:.3em 1em;border-radius:.8em;pointer-events:none;width:max-content;max-width:92%;flex-direction:row;gap:.5em}
.gf{width:2.2em;height:2.2em;border-radius:50%;border:3px solid #f5c518;object-fit:cover}
.fr{display:flex;gap:8px;width:100%}.fb{flex:1;padding:12px 0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:1rem}.fb.on{background:var(--accent)}
#toast{position:absolute;top:2.4em;left:50%;transform:translateX(-50%);background:#f5c518;color:#222;font-weight:800;font-size:.7em;padding:.3em .9em;border-radius:1em;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none;white-space:nowrap}
.gi.gold img,.rcard.gold{animation:gl 1.5s ease-in-out infinite alternate;box-shadow:0 0 16px 4px rgba(255,215,0,.8)}
.rcard.gold{box-shadow:0 0 30px 8px rgba(255,215,0,.9)}
@keyframes gl{0%{box-shadow:0 0 10px 2px rgba(255,200,0,.55);filter:brightness(1)}100%{box-shadow:0 0 26px 9px rgba(255,235,120,.95);filter:brightness(1.18)}}
.pack.g{background:linear-gradient(160deg,#ffe27a 0,#c8900a 45%,#3a2400 100%);border-color:#fff3b0;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 30px rgba(255,215,0,.85)}
.grid{flex-wrap:wrap}
body{background:radial-gradient(ellipse at 50% 0,#14532d 0,#07150d 70%)}
#home{perspective:900px}
#home h1{font-size:2.3rem;letter-spacing:.04em;transform:rotateX(14deg);text-shadow:0 1px 0 #1f8a4c,0 2px 0 #176b3b,0 3px 0 #0f4d2a,0 10px 16px rgba(0,0,0,.6)}
.hb{background:linear-gradient(180deg,#34c06f,#1a7a43);box-shadow:0 5px 0 #0f4d2a,0 10px 18px rgba(0,0,0,.5);transform:rotateX(8deg);transition:transform .12s,box-shadow .12s}
.hb:active{transform:rotateX(8deg) translateY(4px);box-shadow:0 1px 0 #0f4d2a}
.hb.g{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.08));box-shadow:0 5px 0 rgba(0,0,0,.45),0 10px 18px rgba(0,0,0,.4)}
.card{transform:rotateX(6deg);box-shadow:0 12px 30px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.14)}
#flip{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border-radius:18px;padding:12px;perspective:700px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
#flip .pack{width:104px;height:140px;font-size:.8rem;animation:fpf .6s ease}
@keyframes fpf{0%{transform:rotateY(-90deg) scale(.85)}100%{transform:rotateY(0)}}
</style>
</head>
<body>
<div id="wrap" style="display:none">
<canvas id="c" width="800" height="480"></canvas>
<div id="hud"><b><span id="s2">0</span> : <span id="s1">0</span></b><small id="tm">10:00</small><small id="nm"></small></div>
<button id="chat" aria-label="الأصوات">💬</button><div id="sb"></div><div id="fp"></div><button id="rst" title="خروج">✖</button>
<div id="js"><div id="kn"></div></div>
<div class="btns">
<button class="b" id="bt">قطع</button>
<button class="b" id="bs">ركض</button>
<button class="b big" id="bk">تسديد</button>
</div>
<div id="msg"></div><div id="toast"></div>
</div>
<div id="home"><button id="gear" aria-label="الإعدادات">⚙️</button><div id="hb"></div></div>

<script src="shim.js"></script>
